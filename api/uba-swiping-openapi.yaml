    **Model Details:**
    - Algorithm: Random Forest / XGBoost Classifier
    - Features: 200+ touch dynamics features
    - Training Data: Human vs. bot mobile interactions
    - Accuracy: ~90-95%
    - False Positive Rate: <5-10%

  mobile_specific_considerations: |
    **Challenges in Mobile Bot Detection:**

    1. **Device Variation:**
       - Different screen sizes
       - Different touch sensor accuracy
       - Pressure sensor availability varies

    2. **Touch API Limitations:**
       - Not all browsers expose pressure data
       - Touch size/radius may not be available
       - Multi-touch support varies

    3. **Use Case Diversity:**
       - Gaming gestures vs. form filling
       - One-handed vs. two-handed usage
       - Thumb typing vs. finger tapping

    **Model Adaptation:**
    - Feature engineering robust to missing data
    - Normalization for screen size differences
    - Fallback features when pressure unavailable

  error_handling: |
    **Safe Defaults:**

    If ANY error occurs during prediction:
    - Log the error
    - Return ("Human", 1.0) to avoid blocking users
    - Prevents false positives on mobile apps

    **Exception Scenarios:**
    - Insufficient touch events
    - Gesture segmentation failure
    - Feature extraction error
    - Model inference error
    - Missing required touch properties

  integration: |
    **Called By:** uba-api service (mobile device type only)

    **Request Flow:**
    ```
    client-collector → uba-api → uba-swiping (this service)
                          (device_type=mobile)
    ```

