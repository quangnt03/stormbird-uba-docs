  example_usage: |
    **Python Example:**
    ```python
    import requests

    response = requests.post(
        "http://localhost:3003/predict",
        json={
            "data": [
                {"timestamp": 1234567890123, "button": "", "state": "touchstart",
                 "x": 200, "y": 400, "key": None, "deltaY": 0},
                {"timestamp": 1234567890173, "button": "", "state": "touchmove",
                 "x": 220, "y": 395, "key": None, "deltaY": 0},
                {"timestamp": 1234567890223, "button": "", "state": "touchmove",
                 "x": 245, "y": 388, "key": None, "deltaY": 0},
                {"timestamp": 1234567890273, "button": "", "state": "touchend",
                 "x": 270, "y": 380, "key": None, "deltaY": 0}
            ]
        }
    )

    label, probability = response.json()
    print(f"Prediction: {label} ({probability:.2%})")
    ```

    **JavaScript Example (React Native):**
    ```javascript
    const touchEvents = [];

    const handleTouchStart = (e) => {
      touchEvents.push({
        timestamp: Date.now(),
        button: "",
        state: "touchstart",
        x: e.nativeEvent.pageX,
        y: e.nativeEvent.pageY,
        key: null,
        deltaY: 0
      });
    };

    const handleTouchMove = (e) => {
      touchEvents.push({
        timestamp: Date.now(),
        button: "",
        state: "touchmove",
        x: e.nativeEvent.pageX,
        y: e.nativeEvent.pageY,
        key: null,
        deltaY: 0
      });
    };

    const handleTouchEnd = async (e) => {
      touchEvents.push({
        timestamp: Date.now(),
        button: "",
        state: "touchend",
        x: e.nativeEvent.pageX,
        y: e.nativeEvent.pageY,
        key: null,
        deltaY: 0
      });

      const response = await fetch('http://localhost:3003/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({data: touchEvents})
      });

      const [label, probability] = await response.json();
      console.log(`Detection: ${label} (${(probability * 100).toFixed(1)}%)`);
    };
    ```

