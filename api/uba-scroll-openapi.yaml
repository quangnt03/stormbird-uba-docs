    **Model Details:**
    - Algorithm: XGBoost Gradient Boosting
    - Features: 7 scroll dynamics features
    - Training Data: Human vs. bot scrolling sessions
    - Accuracy: ~85-90%
    - Threshold: 0.5 (>0.5 = BOT, <=0.5 = Human)

  scroll_behavior_explanation: |
    **What is Scroll Behavior Analysis?**

    Scroll behavior analysis examines how users scroll through content. Human
    scrolling exhibits natural variability in speed, distance, and timing, while
    automated scrolling shows mechanical regularity.

    **Key Metrics:**

    1. **Scroll Distance (deltaY):**
       - Vertical scroll amount per event
       - Humans: Variable, influenced by content
       - Bots: Constant (e.g., always -120px)

    2. **Scroll Speed:**
       - Rate of scrolling (pixels/millisecond)
       - Humans: Variable with acceleration/deceleration
       - Bots: Constant throughout session

    3. **Action Grouping:**
       - Events grouped by 1-second windows
       - Humans: Irregular patterns with pauses
       - Bots: Regular, evenly-spaced

    4. **Temporal Patterns:**
       - Time between events and actions
       - Humans: Natural pauses to read
       - Bots: Mechanical intervals

  error_handling: |
    **Safe Defaults:**

    If ANY error occurs during prediction:
    - Log the error
    - Return ("Human", 1.0) to avoid blocking users
    - Prevents false positives

    **Exception Scenarios:**
    - No scroll events in data (button != "scroll")
    - Feature extraction failure (empty DataFrame)
    - Model inference error
    - Invalid data format

  integration: |
