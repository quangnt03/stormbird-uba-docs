  example_usage: |
    **Python Example:**
    ```python
    import requests

    response = requests.post(
        "http://localhost:3004/predict",
        json={
            "data": [
                {"timestamp": 1234567890100, "button": "scroll", "state": "move",
                 "x": 500, "y": 300, "key": "", "deltaY": -120},
                {"timestamp": 1234567890200, "button": "scroll", "state": "move",
                 "x": 500, "y": 400, "key": "", "deltaY": -100},
                {"timestamp": 1234567890320, "button": "scroll", "state": "move",
                 "x": 500, "y": 500, "key": "", "deltaY": -95}
            ]
        }
    )

    label, probability = response.json()
    print(f"Prediction: {label} ({probability:.2%})")
    ```

    **cURL Example:**
    ```bash
    curl -X POST http://localhost:3004/predict \
      -H "Content-Type: application/json" \
      -d '{
