  example_usage: |
    **Python Example:**
    ```python
    import requests

    response = requests.post(
        "http://localhost:3002/predict",
        json={
            "data": [
                {"timestamp": 1234567890123, "button": "", "state": "keydown",
                 "x": 0, "y": 0, "key": "h", "deltaY": 0},
                {"timestamp": 1234567890203, "button": "", "state": "keyup",
                 "x": 0, "y": 0, "key": "h", "deltaY": 0},
                {"timestamp": 1234567890256, "button": "", "state": "keydown",
                 "x": 0, "y": 0, "key": "e", "deltaY": 0},
                {"timestamp": 1234567890321, "button": "", "state": "keyup",
                 "x": 0, "y": 0, "key": "e", "deltaY": 0}
            ]
        }
    )

    label, probability = response.json()
    print(f"Prediction: {label} ({probability:.2%})")
    ```

