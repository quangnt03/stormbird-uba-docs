    **Model Details:**
    - Algorithm: SVM / Random Forest Classifier
    - Features: 130+ keystroke dynamics features
    - Training Data: Human vs. bot typing sessions
    - Accuracy: ~90-93%
    - False Positive Rate: <7%

  keystroke_dynamics_explanation: |
    **What is Keystroke Dynamics?**

    Keystroke dynamics (typing dynamics) is a behavioral biometric that analyzes
    the unique way individuals type on keyboards.

    **Key Timing Metrics:**

    1. **Dwell Time (Hold Time):**
       - Duration between keydown and keyup for the same key
       - Humans: Variable (50-150ms typically)
       - Bots: Constant or near-zero

    2. **Flight Time (Inter-key Interval):**
       - Time between releasing one key and pressing the next
       - Humans: Variable based on finger movement distance
       - Bots: Constant or perfectly timed

    3. **Digraph Timing:**
       - Specific timing for common letter pairs
       - Humans: Consistent patterns for same digraphs (e.g., "th" always faster than "qz")
       - Bots: Random or overly consistent

  error_handling: |
    **Safe Defaults:**

    If ANY error occurs during prediction:
    - Log the error
    - Return ("Human", 1.0) to avoid blocking users
    - Prevents false positives

    **Exception Scenarios:**
    - Insufficient keyboard events (< 2 events)
    - Feature extraction failure (missing keyup pairs)
    - Model inference error
    - Invalid data format

