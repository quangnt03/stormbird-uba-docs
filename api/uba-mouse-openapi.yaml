  error_handling: |
    **Safe Defaults:**

    If ANY error occurs during prediction:
    - Log the error
    - Return ("Human", 1.0) to avoid blocking users
    - Prevents false positives that could impact UX

    **Exception Scenarios:**
    - Insufficient data points
    - Feature extraction failure
    - Model inference error
    - Invalid data format

  integration: |
    **Called By:** uba-api service

    **Request Flow:**
    ```
    client-collector → uba-api → uba-mouse (this service)
                                       → uba-keyboard
                                       → uba-scroll
    ```

