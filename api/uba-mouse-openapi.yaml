  example_usage: |
    **Python Example:**
    ```python
    import requests

    response = requests.post(
        "http://localhost:3001/predict",
        json={
            "data": [
                {"timestamp": 1234567890123, "button": "", "state": "move",
                 "x": 100, "y": 100, "key": None, "deltaY": 0},
                {"timestamp": 1234567890173, "button": "", "state": "move",
                 "x": 105, "y": 103, "key": None, "deltaY": 0},
                {"timestamp": 1234567890223, "button": "left", "state": "click",
                 "x": 110, "y": 108, "key": None, "deltaY": 0}
            ]
        }
    )

    label, probability = response.json()
    print(f"Prediction: {label} ({probability:.2%})")
    ```

    **cURL Example:**
    ```bash
    curl -X POST http://localhost:3001/predict \
      -H "Content-Type: application/json" \
      -d '{
        "data": [
          {"timestamp": 1234567890123, "button": "", "state": "move",
           "x": 100, "y": 100, "key": null, "deltaY": 0}
        ]
      }'
    ```
